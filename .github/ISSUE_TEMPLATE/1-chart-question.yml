name: 排盤 / 起卦結果疑問 / Chart result question
description: 覺得某個體系算得不對？請附上輸入和對照結果，我們才能逐項核。
title: "[結果疑問] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        只寫「不準」我們沒法查。請按下面填完整，我們會逐項對照。
        先看一眼：各體系有些口徑本來就分派別（如紫微輔星亮度、閏月歸屬、晚子時換日，奇門拆補與置閏，六壬涉害取法），工具會用「⚠ 假設：」標出；這類差異不算 bug，但仍歡迎指出。
  - type: dropdown
    id: system
    attributes:
      label: 體系
      options: ["八字", "紫微斗數", "六爻", "梅花易數", "大六壬", "奇門遁甲", "小六壬", "擇日", "太乙神數", "皇極經世", "五運六氣"]
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: 輸入
      description: 運行的命令，或出生日期時間、出生地、性別、起卦時間、所給數字等。
      placeholder: 例：node .claude/skills/bazi/scripts/bazi.mjs chart --date 1990-05-12 --time 08:30 --gender 女 --city 杭州
    validations:
      required: true
  - type: textarea
    id: ours
    attributes:
      label: 本項目算出的結果
      description: 貼出工具輸出裡相關的那幾項。
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: 拿什麼對照
      placeholder: 例：某本書第幾卷某例 / 其它排盤軟件
    validations:
      required: true
  - type: textarea
    id: theirs
    attributes:
      label: 對照結果
      description: 截圖或文字。
    validations:
      required: true
  - type: textarea
    id: diff
    attributes:
      label: 具體哪一項不一致
      placeholder: 例：初傳應為子，這裡取了午
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 運行環境
      placeholder: 例：macOS 15 / Node 22
