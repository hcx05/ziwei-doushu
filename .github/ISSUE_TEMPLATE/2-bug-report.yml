name: 程序问题 / Bug report
description: 代码跑不起来、报错、页面显示异常
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        本 fork 不含网站界面与 `/api/*` 接口，只有排盘引擎与 Claude Skill。
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. node .claude/skills/ziwei-doushu/scripts/ziwei.mjs chart --date …… --time …… --gender ……
        2. 输出中哪一项不对 ……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果（报错信息、截图）
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 运行环境
      placeholder: 例：macOS 15 / Node 22 / Chrome 140
