name: 程序問題 / Bug report
description: 代碼跑不起來、報錯、頁面顯示異常
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        本倉庫不含網站界面與 `/api/*` 接口，只有各體系引擎與 Claude Skill。
  - type: textarea
    id: steps
    attributes:
      label: 復現步驟
      placeholder: |
        1. node .claude/skills/<skill>/scripts/<工具>.mjs ……
        2. 輸出中哪一項不對 ……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 實際結果（報錯信息、截圖）
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 運行環境
      placeholder: 例：macOS 15 / Node 22 / Chrome 140
